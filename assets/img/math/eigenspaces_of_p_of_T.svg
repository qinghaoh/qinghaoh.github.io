<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="900" height="380" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="900" height="380" fill="#ffffff"/>

  <!-- Panel 1: merge -->
  <rect x="16" y="16" width="420" height="348" rx="16" fill="#fafaf9" stroke="#d4d4d4"/>
  <text x="226" y="52" text-anchor="middle" font-size="20" font-weight="600" fill="#1f1f1f">Merge: p(λ₁) = p(λ₂) = α</text>

  <!-- lambda_1 diagram: columns 2, 1 -->
  <g fill="#ECEAFB" stroke="#5B4FC4" stroke-width="1.5">
    <rect x="40" y="232" width="32" height="32" rx="3"/>
    <rect x="40" y="266" width="32" height="32" rx="3"/>
    <rect x="76" y="266" width="32" height="32" rx="3"/>
  </g>
  <text x="74" y="326" text-anchor="middle" font-size="18" fill="#5B4FC4">λ₁</text>

  <!-- lambda_2 diagram: column 3 -->
  <g fill="#E3F4EC" stroke="#1F7A5A" stroke-width="1.5">
    <rect x="140" y="198" width="32" height="32" rx="3"/>
    <rect x="140" y="232" width="32" height="32" rx="3"/>
    <rect x="140" y="266" width="32" height="32" rx="3"/>
  </g>
  <text x="156" y="326" text-anchor="middle" font-size="18" fill="#1F7A5A">λ₂</text>

  <!-- arrow -->
  <line x1="196" y1="250" x2="252" y2="250" stroke="#555" stroke-width="2"/>
  <polygon points="252,244 264,250 252,256" fill="#555"/>
  <text x="228" y="238" text-anchor="middle" font-size="18" font-style="italic" fill="#333">p</text>

  <!-- alpha diagram: columns 3 (green), 2 (purple), 1 (purple) -->
  <g fill="#E3F4EC" stroke="#1F7A5A" stroke-width="1.5">
    <rect x="290" y="198" width="32" height="32" rx="3"/>
    <rect x="290" y="232" width="32" height="32" rx="3"/>
    <rect x="290" y="266" width="32" height="32" rx="3"/>
  </g>
  <g fill="#ECEAFB" stroke="#5B4FC4" stroke-width="1.5">
    <rect x="326" y="232" width="32" height="32" rx="3"/>
    <rect x="326" y="266" width="32" height="32" rx="3"/>
    <rect x="362" y="266" width="32" height="32" rx="3"/>
  </g>
  <text x="342" y="326" text-anchor="middle" font-size="18" fill="#333">α</text>

  <!-- Panel 2: split -->
  <rect x="464" y="16" width="420" height="348" rx="16" fill="#fafaf9" stroke="#d4d4d4"/>
  <text x="674" y="52" text-anchor="middle" font-size="20" font-weight="600" fill="#1f1f1f">Split: critical point of order r = 2</text>

  <!-- column of height 5, boxes 1..5 top to bottom -->
  <g stroke-width="1.5">
    <rect x="530" y="130" width="32" height="32" rx="3" fill="#FBEBD3" stroke="#B26B00"/>
    <rect x="530" y="164" width="32" height="32" rx="3" fill="#E2EDFA" stroke="#2F6DB5"/>
    <rect x="530" y="198" width="32" height="32" rx="3" fill="#FBEBD3" stroke="#B26B00"/>
    <rect x="530" y="232" width="32" height="32" rx="3" fill="#E2EDFA" stroke="#2F6DB5"/>
    <rect x="530" y="266" width="32" height="32" rx="3" fill="#FBEBD3" stroke="#B26B00"/>
  </g>
  <g font-size="16" text-anchor="middle" fill="#333">
    <text x="546" y="152">1</text>
    <text x="546" y="186">2</text>
    <text x="546" y="220">3</text>
    <text x="546" y="254">4</text>
    <text x="546" y="288">5</text>
  </g>
  <text x="546" y="326" text-anchor="middle" font-size="18" fill="#333">J₅(λ)</text>

  <!-- arrow -->
  <line x1="590" y1="250" x2="654" y2="250" stroke="#555" stroke-width="2"/>
  <polygon points="654,244 666,250 654,256" fill="#555"/>
  <text x="626" y="238" text-anchor="middle" font-size="18" font-style="italic" fill="#333">p</text>
  <text x="626" y="276" text-anchor="middle" font-size="14" fill="#555">M ∼ N²</text>

  <!-- two columns: 1,3,5 and 2,4 -->
  <g stroke-width="1.5">
    <rect x="700" y="198" width="32" height="32" rx="3" fill="#FBEBD3" stroke="#B26B00"/>
    <rect x="700" y="232" width="32" height="32" rx="3" fill="#FBEBD3" stroke="#B26B00"/>
    <rect x="700" y="266" width="32" height="32" rx="3" fill="#FBEBD3" stroke="#B26B00"/>
    <rect x="736" y="232" width="32" height="32" rx="3" fill="#E2EDFA" stroke="#2F6DB5"/>
    <rect x="736" y="266" width="32" height="32" rx="3" fill="#E2EDFA" stroke="#2F6DB5"/>
  </g>
  <g font-size="16" text-anchor="middle" fill="#333">
    <text x="716" y="220">1</text>
    <text x="716" y="254">3</text>
    <text x="716" y="288">5</text>
    <text x="752" y="254">2</text>
    <text x="752" y="288">4</text>
  </g>
  <text x="734" y="326" text-anchor="middle" font-size="18" fill="#333">J₃(p(λ)) ⊕ J₂(p(λ))</text>
</svg>
