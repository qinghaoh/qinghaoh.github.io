<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 330" width="480" height="330">
<defs><clipPath id="frame"><rect x="0" y="0" width="480" height="330"/></clipPath><marker id="headv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker></defs>
<rect width="480" height="330" fill="#ffffff"/>
<!-- Level sets H_c of phi: the lines t = c / |v| -->
<g clip-path="url(#frame)">
<line x1="400" y1="539" x2="-32" y2="-37" stroke="#9ca3af" stroke-width="1.4"/>
<line x1="448" y1="503" x2="16" y2="-73" stroke="#222222" stroke-width="2"/>
<line x1="496" y1="467" x2="64" y2="-109" stroke="#9ca3af" stroke-width="1.4"/>
<line x1="544" y1="431" x2="112" y2="-145" stroke="#9ca3af" stroke-width="1.4"/>
<line x1="592" y1="395" x2="160" y2="-181" stroke="#9ca3af" stroke-width="1.4"/>
</g>
<!-- Labels of the level sets, along the top edge -->
<text x="22.2" y="26" font-family="TeX Gyre Pagella, Palatino, Palatino Linotype, Book Antiqua, serif" font-size="16" fill="#6b7280" text-anchor="start"><tspan font-style="italic">H</tspan><tspan font-size="70%" baseline-shift="sub">−1</tspan></text>
<text x="97.2" y="26" font-family="TeX Gyre Pagella, Palatino, Palatino Linotype, Book Antiqua, serif" font-size="16" fill="#222222" text-anchor="start"><tspan font-style="italic">H</tspan><tspan font-size="70%" baseline-shift="sub">0</tspan> = <tspan font-style="italic">v</tspan><tspan font-family="TeX Gyre Pagella Math, Palatino, Palatino Linotype, Cambria Math, STIX Two Math, serif" font-size="75%" baseline-shift="super">⊥</tspan></text>
<text x="172.2" y="26" font-family="TeX Gyre Pagella, Palatino, Palatino Linotype, Book Antiqua, serif" font-size="16" fill="#6b7280" text-anchor="start"><tspan font-style="italic">H</tspan><tspan font-size="70%" baseline-shift="sub">1</tspan></text>
<text x="247.2" y="26" font-family="TeX Gyre Pagella, Palatino, Palatino Linotype, Book Antiqua, serif" font-size="16" fill="#6b7280" text-anchor="start"><tspan font-style="italic">H</tspan><tspan font-size="70%" baseline-shift="sub">2</tspan></text>
<text x="322.2" y="26" font-family="TeX Gyre Pagella, Palatino, Palatino Linotype, Book Antiqua, serif" font-size="16" fill="#6b7280" text-anchor="start"><tspan font-style="italic">H</tspan><tspan font-size="70%" baseline-shift="sub">3</tspan></text>
<!-- The spacing 1/|v| between H_0 and H_1, measured along n -->
<line x1="286" y1="287" x2="334" y2="251" stroke="#222222" stroke-width="1.2"/>
<line x1="289" y1="291" x2="283" y2="283" stroke="#222222" stroke-width="1.2"/>
<line x1="337" y1="255" x2="331" y2="247" stroke="#222222" stroke-width="1.2"/>
<text x="324" y="289" font-family="TeX Gyre Pagella, Palatino, Palatino Linotype, Book Antiqua, serif" font-size="16" fill="#222222" text-anchor="start">1 / ‖<tspan font-style="italic">v</tspan>‖</text>
<!-- A point u = t n + w on H_3 -->
<line x1="232" y1="215" x2="376" y2="107" stroke="#d97706" stroke-width="2.4" stroke-dasharray="6 4"/>
<line x1="376" y1="107" x2="343.6" y2="63.8" stroke="#059669" stroke-width="2.4" stroke-dasharray="6 4"/>
<polyline points="368.8,112.4 363.4,105.2 370.6,99.8" fill="none" stroke="#222222" stroke-width="1.2"/>
<!-- v, normal to the level sets -->
<line x1="232" y1="215" x2="337.8" y2="135.6" stroke="#2563eb" stroke-width="2.8" marker-end="url(#headv)"/>
<polyline points="239.2,209.6 233.8,202.4 226.6,207.8" fill="none" stroke="#222222" stroke-width="1.2"/>
<circle cx="232" cy="215" r="4" fill="#222222"/>
<circle cx="376" cy="107" r="3.5" fill="#d97706"/>
<circle cx="343.6" cy="63.8" r="4.5" fill="#222222"/>
<text x="224" y="235" font-family="TeX Gyre Pagella, Palatino, Palatino Linotype, Book Antiqua, serif" font-size="16" fill="#222222" text-anchor="end">0</text>
<text x="311" y="182.8" font-family="TeX Gyre Pagella, Palatino, Palatino Linotype, Book Antiqua, serif" font-size="18" fill="#2563eb" text-anchor="start"><tspan font-style="italic">v</tspan></text>
<text x="372.2" y="138.9" font-family="TeX Gyre Pagella, Palatino, Palatino Linotype, Book Antiqua, serif" font-size="16" fill="#d97706" text-anchor="start"><tspan font-style="italic">t</tspan> <tspan font-style="italic">n</tspan></text>
<text x="371.8" y="87.4" font-family="TeX Gyre Pagella, Palatino, Palatino Linotype, Book Antiqua, serif" font-size="17" fill="#059669" text-anchor="start"><tspan font-style="italic">w</tspan></text>
<text x="353.6" y="55.8" font-family="TeX Gyre Pagella, Palatino, Palatino Linotype, Book Antiqua, serif" font-size="18" fill="#222222" text-anchor="start"><tspan font-style="italic">u</tspan></text>
</svg>
