<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500">
  <defs>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1e3a8a"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b42318"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="500" fill="#ffffff"/>
  <rect x="16" y="16" width="868" height="468" rx="16" fill="#fafaf9" stroke="#d4d4d4"/>

  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" letter-spacing="1.5" fill="#737373">
    <text x="40" y="52">VECTOR SPACES</text>
    <text x="40" y="282">DUAL SPACES</text>
  </g>
  <line x1="40" y1="250" x2="860" y2="250" stroke="#e5e5e5" stroke-width="1.5"/>

  <g font-family="STIX Two Text, Cambria, Times New Roman, serif">
    <!-- Row 1: V -T-> W -phi-> F, and the composite V -> F -->
    <g font-size="38" font-style="italic" fill="#1e3a8a" text-anchor="middle">
      <text x="170" y="182">V</text>
      <text x="450" y="182">W</text>
    </g>
    <text x="730" y="182" font-size="38" font-weight="bold" fill="#1e3a8a" text-anchor="middle">F</text>

    <line x1="205" y1="170" x2="410" y2="170" stroke="#1e3a8a" stroke-width="2.5" marker-end="url(#ab)"/>
    <text x="307" y="156" font-size="26" font-style="italic" fill="#1e3a8a" text-anchor="middle">T</text>

    <line x1="490" y1="170" x2="695" y2="170" stroke="#0f766e" stroke-width="2.5" marker-end="url(#ag)"/>
    <text x="592" y="156" font-size="26" font-style="italic" fill="#0f766e" text-anchor="middle">φ</text>

    <path d="M180,140 C300,62 600,62 720,140" fill="none" stroke="#b42318" stroke-width="2.5" marker-end="url(#ar)"/>
    <text x="450" y="64" font-size="26" fill="#b42318" text-anchor="middle"><tspan font-style="italic">φ</tspan> ∘ <tspan font-style="italic">T</tspan></text>

    <!-- Row 2: V' <-T'- W' -->
    <g font-size="38" fill="#1e3a8a" text-anchor="middle">
      <text x="170" y="362"><tspan font-style="italic">V</tspan>′</text>
      <text x="450" y="362"><tspan font-style="italic">W</tspan>′</text>
    </g>
    <g font-size="20" fill="#737373" text-anchor="middle">
      <text x="170" y="398">= <tspan font-style="italic">L</tspan>(<tspan font-style="italic">V</tspan>, <tspan font-weight="bold">F</tspan>)</text>
      <text x="450" y="398">= <tspan font-style="italic">L</tspan>(<tspan font-style="italic">W</tspan>, <tspan font-weight="bold">F</tspan>)</text>
    </g>

    <line x1="410" y1="350" x2="215" y2="350" stroke="#b42318" stroke-width="2.5" marker-end="url(#ar)"/>
    <text x="312" y="336" font-size="26" fill="#b42318" text-anchor="middle"><tspan font-style="italic">T</tspan>′</text>

    <!-- element-level action -->
    <text x="700" y="345" font-size="24" fill="#1f1f1f" text-anchor="middle"><tspan font-style="italic">T</tspan>′(<tspan font-style="italic" fill="#0f766e">φ</tspan>) = <tspan fill="#b42318"><tspan font-style="italic">φ</tspan> ∘ <tspan font-style="italic">T</tspan></tspan></text>
    <text x="700" y="378" font-size="17" fill="#737373" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif">sends <tspan fill="#0f766e">φ ∈ W′</tspan> to <tspan fill="#b42318">φ ∘ T ∈ V′</tspan></text>
  </g>

  <text x="450" y="452" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#525252" text-anchor="middle">Precomposing with T turns a functional on W into one on V, so T′ runs backwards: W′ → V′.</text>
</svg>
